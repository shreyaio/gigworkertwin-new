# The design agent's style contract. docs/02 §4.4.
# Constant across all 243 cells: anything that varies with the cell is a confound.
# Bumping style_version invalidates the cached lever paragraphs and the variants built from them
# (`lever_paragraphs` is keyed on (lever, dial, style_version) and `variants` on
# (version_code, style_version)), and nothing else (I4).
#
# **Any change to this file, once a paragraph has been PERSISTED, MUST bump style_version.** A
# cached paragraph served under a contract it was not written to is exactly the silent confound
# the (lever, dial, style_version) key exists to prevent.
#
# HISTORY
#
# v1, until 2026-10-01. The 2026-09-29 band widenings (word_max 70 -> 75 -> 150) did NOT bump it,
#   correctly at the time: no paragraph had ever survived a process. `pydantic_ai` was not
#   installed, the migrations were unapplied and `lever_paragraphs` had never been written, so
#   there was nothing to mis-serve and a v2 whose v1 produced no text would have sent a future
#   reader hunting for renders that never existed.
#
# v2, from 2026-10-01. The rule above now bites for the first time: M15 persisted 7 rows in
#   `lever_paragraphs` and 3 passing `variants` (00000, 01000, 00001) under v1, and the
#   2026-10-01 change below alters what the design agent is shown, so a v1 paragraph and a v2
#   paragraph are no longer written to the same contract. Those three cells must be re-rendered
#   under v2; that cost is paid now, deliberately, because it only grows once a sweep has run.
#   RESEARCHER, 2026-10-01. See docs/DECISIONS.md M16.
#
# v3, from 2026-10-03. The band stops being one pair of scalars and becomes a function of how
#   many commitments the brief carries. RESEARCHER, 2026-10-03; see docs/DECISIONS.md M19 WP-1.
#
#   Why it had to change. The commitment count per (lever, dial) is not constant -- it ranges 2 to
#   8 (dial_lookup.json; ARCHITECTURE.md S5). One cap of 150 therefore allowed 75 words per
#   commitment at L1 dial 1 and 18 at L3/L4 dial 2. The design prompt asks for each commitment "in
#   its own short sentence" and the Checker probes each one for entailment, so at eight
#   commitments the model had no choice but to compress, and compression is exactly what loses an
#   entailment. Measured, over the eight paragraphs this project actually rendered under v2:
#
#     n  lever.dial  words  words/commitment  verdict
#     2  L1.1           77  38                pass
#     3  L2.1           88  29                pass
#     3  L1.2           92  31                pass
#     3  L5.1           96  32                pass
#     3  L4.1          109  36                pass
#     6  L2.2          138  23                pass
#     8  L3.2          150  19                FAIL (coverage: 3.1.b, 3.2.a, 3.2.c, 4.1.a, 4.2.d)
#     8  L4.2          152  19                FAIL (band + coverage)
#
#   The formula below is calibrated against that table, not invented: it accepts all six that
#   passed and rejects both that failed, and it rejects them for being TOO SHORT -- which is the
#   correct diagnosis. The floor for eight commitments is 159; both failures came in at 150/152.
#
#   What it costs, recorded here because it must also be in the paper's limitations. Paragraph
#   length now varies systematically with dial: a dial-1 cell reads ~90 words and a dial-2 cell
#   ~180, so dial is partly confounded with how much text a twin reads. That was ALREADY true
#   under v2's unverified 150 and is unavoidable -- more commitments is more text. The formula
#   makes the covariance explicit, deterministic and constant for a given (lever, dial) rather
#   than leaving it to be whatever the model happened to compress to. The alternative considered
#   and rejected was paragraphs_per_lever: 2 at dial 2, which changes the SHAPE of the stimulus
#   between dials and is a larger confound than the one it fixes.
#
#   I4 is untouched: still ten paragraphs per style version, still cached on
#   (lever, dial, style_version), still byte-identical in every cell that uses them. The band is a
#   pure function of (lever, dial) via the frozen lookup, so it cannot vary with the cell.
#
# The v2 change is NOT in this file's values. `reading_grade_min` and `reading_grade_max` were
# added to `agents.design.STYLE_KEYS_SHOWN`, so the band below is now part of the design prompt
# instead of being withheld from it. The prompt is a style-contract input, so this bumps.
style_version: v9
person: second
tense: present or near-future
paragraphs_per_lever: 1
# The word band, resolved per (lever, dial) from the number of commitments in that brief.
#
#   word_min = word_min_base + word_min_per_commitment * n
#   word_max = word_max_base + word_max_per_commitment * n
#
# then clamped into [word_floor, word_ceiling]. `n` is len(brief.commitments) -- for a live cell
# the commitments that (lever, dial) closes, for the sham the number of slots that lever
# announces. Dial 0 never reaches the band: it is a constant (I5) and gate 4 holds it to account.
#
# The resolved pair is written into the brief's own copy of this contract, so the design agent is
# shown ITS OWN band (STYLE_KEYS_SHOWN) and the Checker's gate 3 reads the same two numbers. See
# the v3 HISTORY note above for the calibration table and the confound this makes explicit.
word_min_base: 15
word_min_per_commitment: 18
word_max_base: 25
word_max_per_commitment: 30
# Absolute clamps. Not expected to bind for any n in 2..8 (the resolved bands run [51, 85] at n=2
# to [159, 265] at n=8); they are here so a pathological n -- a reference-data change that put 40
# commitments on one lever -- cannot produce an absurd band silently. The floor is v1's original
# word_min, kept because the specification's own 71-word exemplar must stay admissible.
word_floor: 45
word_ceiling: 300
bullets: false
numbers: only where the GapSpec supplies them
forbidden_terms: [Fairwork, principle, threshold, score, research, study, survey, twin]
# Reading-grade band for the invariance gate (docs/02 §4.5 gate 3 names the gate but no numbers).
# Flesch-Kincaid. Wide enough that ordinary policy prose passes, tight enough that one cell cannot
# be markedly harder to read than another. CONFIG.
#
# SHOWN TO THE DESIGN AGENT from v2 (STYLE_KEYS_SHOWN). Both bounds, because gate 3 tests both.
# These two keys are therefore no longer free to change: a change here changes the design prompt,
# so it bumps style_version even though 16.0 is otherwise an ordinary CONFIG number.
reading_grade_min: 4.0
reading_grade_max: 16.0
forbidden_intensifiers: [dramatically, finally, at last, revolutionary, unprecedented, historic]
dial_zero_text: "No change from today."
lever_order_in_text: fixed
lever_order_to_twin: randomised
